spring.application.name=sync_point
app.api-version=v1
app.title=api/${app.api-version}

# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Server
server.port=${PORT:2000}
base-url=${BASE_URL:http://localhost:2000}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis

# Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URL}
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.get-token-url=${KEYCLOAK_TOKEN_URL}
keycloak.issuer-url=${KEYCLOAK_ISSUER_URL}

# Retry
spring.retry.max-attempts=3
spring.retry.backoff.initial-interval=100
spring.retry.backoff.multiplier=2.0
spring.retry.backoff.max-interval=1000