####################
# Database
####################
spring.datasource.url=jdbc:mysql://localhost:3306/sync_point_db?serverTimezone=Africa/Lagos
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Fly-way config
spring.flyway.enabled=false

####################
# Server
####################
server.port=2000
base-url=http://localhost:2000


####################
# Redis
####################
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
spring.data.redis.password=

spring.cache.type=redis


####################
# Password Reset (dev override)
####################
app.otp.log-to-console=true

# App secret
app.reset.secret=${APP_RESET_SECRET:}

# Secret internal-auth must present (X-Admin-Secret) to push a session
# invalidation from its "Logout all sessions" console action. See
# AdminSessionController / SessionInvalidateAuthorizer. Blank disables the
# endpoint entirely, same fail-closed posture as app.reset.secret above.
app.session-invalidate.secret=${APP_SESSION_INVALIDATE_SECRET:}