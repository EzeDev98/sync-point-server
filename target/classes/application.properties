spring.application.name=sync_point

# API
app.api-version=v1
app.title=api/${app.api-version}

# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/sync_point_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Server
server.port=2000
base-url=http://localhost:2000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

spring.data.redis.password=
spring.redis.host=${spring.data.redis.host}
spring.redis.port=${spring.data.redis.port}
spring.redis.database=${spring.data.redis.database}
spring.redis.password=${spring.data.redis.password}

spring.cache.type=redis

# Security - Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/ezemoses
jwt.auth.converter.resource-id=movie-app-server

keycloak.server-url=http://localhost:8080
keycloak.realm=ezemoses
keycloak.client-id=sync-point
keycloak.client-secret=fS5DoR3AckmSzw6rRBz4s7CC4FxiyQBE
keycloak.get-token-url=http://localhost:8080/realms/ezemoses/protocol/openid-connect/token
keycloak.issuer-url=http://localhost:8080/realms/ezemoses

# ============================================
# Retry Configuration
# ============================================
spring.retry.max-attempts=3
spring.retry.backoff.initial-interval=100
spring.retry.backoff.multiplier=2.0
spring.retry.backoff.max-interval=1000