spring.application.name=sync_point

###############################################################
# Active Profile
# Possible values = @activatedProperties@, dev, prod
# @activatedProperties@ uses the active profile in the pom.xml
###############################################################
spring.profiles.active=dev
#Application specific properties

#####################################################
# API
#####################################################
app.api-version=v1
app.title=api/${app.api-version}

#####################################################
# Retry
#####################################################
spring.retry.max-attempts=3
spring.retry.backoff.initial-interval=100
spring.retry.backoff.multiplier=2.0
spring.retry.backoff.max-interval=1000

#####################################################
# Password Reset (Phone-number OTP)
#####################################################
password-reset.otp.length=6
password-reset.otp.expiration-minutes=5
password-reset.otp.max-attempts=5
password-reset.otp.resend-cooldown-seconds=60
password-reset.token.expiration-minutes=10

#####################################################
# Pin Reset (Phone-number OTP) ? endpoints are authenticated,
# unlike password-reset (see WebSecurityConfig)
#####################################################
pin-reset.otp.length=6
pin-reset.otp.expiration-minutes=5
pin-reset.otp.max-attempts=5
pin-reset.otp.resend-cooldown-seconds=60
pin-reset.token.expiration-minutes=10

# Dev-only: logs the raw OTP to the console instead of sending real SMS.
# Must be false in production (see application-prod.properties).
app.otp.log-to-console=false

# Which OtpDeliveryService implementation is active: "logging" (default,
# console-only, $0) or "contiguity" (real SMS via Contiguity's free tier ?
# 500 SMS/month at no cost). See ContiguityOtpDeliveryService.
app.otp.provider=contiguity

#####################################################
# Contiguity (SMS provider) ? only used when app.otp.provider=contiguity
# Sign up free at https://console.contiguity.com and paste your API key
# into CONTIGUITY_API_KEY (env var) rather than committing it here.
#####################################################
contiguity.api-key=${CONTIGUITY_API_KEY:}
contiguity.base-url=https://api.contiguity.com
contiguity.sender-app-name=SyncPoint

internal-auth.base-url=${INTERNAL_AUTH_BASE_URL:http://localhost:5151/api/v1}
internal-auth.client-id=${INTERNAL_AUTH_CLIENT_ID:sync-point}
internal-auth.client-secret=${INTERNAL_AUTH_CLIENT_SECRET:}
internal-auth.issuer-url=${INTERNAL_AUTH_ISSUER_URL:http://localhost:5151}
internal-auth.reset.secret=${INTERNAL_AUTH_RESET_SECRET:}